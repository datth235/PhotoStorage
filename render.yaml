services:
  - type: web
    name: photostorage
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SESSION_SECRET
        generateValue: true

      # Metadata (danh sách ảnh / kỷ niệm / hẹn hò) -> MongoDB Atlas (free).
      # Điền giá trị trong Dashboard Render (Environment). sync:false = không lưu vào file này.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: thuvien_anh

      # File ảnh gốc + thumbnail -> Cloudinary (free).
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: thuvien-anh

      # Tuỳ chọn: đổi / thêm tài khoản đăng nhập
      # - key: USERS
      #   value: '{"admin":"matkhaumanh"}'

    # Không cần ổ đĩa bền nữa: ảnh nằm ở Cloudinary, metadata ở MongoDB Atlas.
    # (Nếu KHÔNG đặt MONGODB_URI / CLOUDINARY_URL thì web chạy chế độ cục bộ và
    #  sẽ mất dữ liệu mỗi lần Render deploy lại — chỉ nên dùng khi chạy máy cá nhân.)
