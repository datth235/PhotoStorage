<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <title>Đăng nhập — Thư viện ảnh</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231bb76e'/%3E%3Ctext y='72' x='50' font-size='60' text-anchor='middle'%3E%F0%9F%96%BC%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/style.css?v=13" />
  </head>
  <body>
    <div class="login-wrap">
      <!-- trang trí nền cho đỡ trống -->
      <div class="login-deco" aria-hidden="true">
        <img class="deco-gif deco-gif-1" src="/img/cat-dance.webp" alt="" width="166" height="170" />
        <img class="deco-gif deco-gif-2" src="/img/cat-kiss.webp" alt="" width="200" height="200" />

        <svg class="heart h1" viewBox="0 0 24 24"><path d="M12 21c-1-1-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-9 12z" /></svg>
        <svg class="heart h2" viewBox="0 0 24 24"><path d="M12 21c-1-1-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-9 12z" /></svg>
        <svg class="heart h3" viewBox="0 0 24 24"><path d="M12 21c-1-1-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-9 12z" /></svg>
        <svg class="heart h4" viewBox="0 0 24 24"><path d="M12 21c-1-1-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-9 12z" /></svg>
        <svg class="heart h5" viewBox="0 0 24 24"><path d="M12 21c-1-1-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-9 12z" /></svg>
        <svg class="heart h6" viewBox="0 0 24 24"><path d="M12 21c-1-1-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-8 11-9 12z" /></svg>
      </div>

      <form class="login-card" id="loginForm">
        <div class="mascot-wrap" aria-hidden="true">
          <svg class="mascot" viewBox="0 0 200 172" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="camBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#26c684" />
                <stop offset="1" stop-color="#148f55" />
              </linearGradient>
            </defs>
            <path d="M42 76C56 32 144 32 158 76" fill="none" stroke="#3c3c45" stroke-width="8" stroke-linecap="round" />
            <rect x="24" y="60" width="152" height="102" rx="27" fill="url(#camBody)" />
            <path d="M74 46h28a11 11 0 0 1 11 11v7H63v-7a11 11 0 0 1 11-11z" fill="#128a52" />
            <rect x="130" y="50" width="30" height="16" rx="7" fill="#cdf8e3" />
            <rect x="34" y="50" width="20" height="13" rx="6" fill="#0c6b41" />
            <circle cx="100" cy="114" r="44" fill="#0e0e10" />
            <circle cx="100" cy="114" r="32" fill="#0f3b2a" />
            <circle cx="114" cy="101" r="9" fill="#1d6047" />
            <circle cx="87" cy="108" r="5.2" fill="#fff" />
            <circle cx="113" cy="108" r="5.2" fill="#fff" />
            <path d="M88 123q12 12 24 0" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" />
            <ellipse cx="74" cy="120" rx="7.5" ry="5" fill="#ff8fb1" opacity="0.85" />
            <ellipse cx="126" cy="120" rx="7.5" ry="5" fill="#ff8fb1" opacity="0.85" />
          </svg>
        </div>

        <a href="/" class="brand">
          <span class="logo">🖼️</span>
          <span class="brand-name">Thư viện ảnh</span>
        </a>
        <p class="subtitle">Kho ảnh nhỏ xinh của bạn ✨</p>

        <div class="form-error hidden" id="formError"></div>

        <div class="field">
          <label for="username">Tài khoản</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Tên đăng nhập" required autofocus />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Mật khẩu" required />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Đăng nhập</button>

        <p class="hint">Nhập tài khoản &amp; mật khẩu đã được cấp nhé 🌿</p>
      </form>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="/js/common.js?v=8"></script>
    <script src="/js/login.js?v=8"></script>
  </body>
</html>
